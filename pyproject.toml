[project]
name = "thai-shop-sql-agent"
version = "0.1.0"
description = "Text-to-SQL agent over a synthetic Thai online-shop database"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.161.1",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "sqlglot>=30.24.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "thai_shop_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
